<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flightradar</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#020a05">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Radar">
<style>
  :root { --fg: #4dff88; --dim: #1f6b3a; --bg: #020a05; --alert: #ff4d4d; }
  * { box-sizing: border-box; }
  html { touch-action: pan-x pan-y; } /* no pinch or double-tap zoom, scrolling stays */
  body { margin: 0; height: 100dvh; display: flex; background: var(--bg); color: var(--fg); font: 13px ui-monospace, Menlo, monospace; }
  main { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #map { pointer-events: none; }
  #map.osm { opacity: .45; }
  #map.dark { filter: grayscale(1) invert(1) brightness(.75) contrast(1.3); }
  #attrib { position: absolute; bottom: 6px; left: 12px; font-size: 11px; opacity: .7; }
  #attrib a { color: inherit; }
  #status { position: absolute; top: 12px; left: 12px; right: 56px; font-size: 11px; pointer-events: none; }
  #menu-btn { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; font-size: 20px; }
  /* top/right are set from the button position when it opens */
  #menu { position: fixed; inset: auto; margin: 0; padding: 8px 12px; line-height: 2.2; background: var(--bg); color: var(--fg); border: 1px solid var(--dim); }
  #menu select, #menu button, #menu input, #menu-btn { background: var(--bg); color: var(--fg); border: 1px solid var(--dim); font: inherit; cursor: pointer; }
  #menu button.on { background: var(--dim); }
  #menu select, #menu button, #menu input { height: 24px; padding: 0 6px; line-height: 1; vertical-align: middle; }
  #menu button { min-width: 24px; }
  #alert-list { list-style: none; margin: 0; padding: 0; line-height: 1.8; }
  #alert-msg:empty { display: none; }
  #alert-msg { line-height: 1.4; max-width: 300px; color: var(--alert); }
  /* mouse devices have room: the menu stays open in the radar's corner, no ⋮ (author display beats the popover's UA display: none) */
  @media (hover: hover) and (pointer: fine) {
    #menu-btn { display: none; }
    #menu { display: block; position: absolute; inset: 8px 8px auto auto; }
  }
  aside { width: min(320px, 40vw); border-left: 1px solid var(--dim); overflow-y: auto; padding: 12px; }
  h2 { font-size: 13px; margin: 0 0 8px; letter-spacing: .1em; }
  #filter { width: 100%; margin-bottom: 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--dim); font: inherit; padding: 2px 4px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 16px; }
  dt { opacity: .6; }
  dd { margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 4px; white-space: nowrap; }
  td:not(:first-child) { text-align: right; }
  tr { cursor: pointer; }
  tr:hover, tr.sel { background: #0c2b17; }
  .alert { color: var(--alert); }
  @media (max-width: 800px) and (orientation: portrait) { body { flex-direction: column; } aside { width: auto; height: 40dvh; border-left: 0; border-top: 1px solid var(--dim); } }
</style>
</head>
<body>
<main>
  <canvas id="map"></canvas>
  <canvas id="radar"></canvas>
  <div id="attrib" hidden>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
  <div id="status">locating…</div>
  <button id="menu-btn" popovertarget="menu" aria-label="settings">⋮</button>
  <div id="menu" popover>
    <div>RANGE <select id="range"></select> <span class="dist-unit">NM</span></div>
    <div>MAP <select id="layer"><option value="">off</option><option value="dark">OSM dark</option><option value="osm">OSM</option></select></div>
    <div>UNITS <button id="units" title="km, km/h, m, m/s instead of nm, kt, ft, ft/min">METRIC</button></div>
    <div>HDG <span id="hdg">000</span>° <button id="north" title="north up">N↑</button> <button id="lock" title="lock heading: dragging the radar no longer rotates it">LOCK</button> <button id="compass" hidden>COMPASS</button></div>
    <form id="loc">POS <input id="coords" placeholder="48.78, 9.18" size="18" aria-label="latitude, longitude"> <button>SET</button> <button type="button" id="gps">GPS</button></form>
    <div>FAV <select id="places" aria-label="saved positions"></select> <button id="save-place" title="save current position">+</button> <button id="del-place" title="remove selected position">−</button></div>
    <div title="push notification when a match comes within the radius of the current POS, also with the app closed">ALERTS</div>
    <ul id="alert-list"></ul>
    <form id="alert-form"><input id="alert-filter" placeholder="mil, beluga… (empty: any)" size="16" aria-label="alert filter"> <select id="alert-radius" aria-label="alert radius"></select> <span class="dist-unit">NM</span> <button title="add alert around the current position">+</button></form>
    <div id="alert-msg"></div>
  </div>
</main>
<aside>
  <h2>SELECTED</h2>
  <dl id="detail"><dt>-</dt><dd>click a target</dd></dl>
  <h2>TARGETS <span id="count"></span></h2>
  <input id="filter" placeholder="filter: beluga, mil, A388, DLH, D-AI…" aria-label="filter targets" title="space-separated, any term matches: callsign, registration, ICAO type code or description (partial ok), mil for military, or beluga / a380 / 747 / dreamliner / concorde. Full type codes (A337, B748) are also looked up worldwide.">
  <table><tbody id="list"></tbody></table>
</aside>
<script type="module" src="./app.js"></script>
</body>
</html>
